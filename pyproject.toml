[project]
name = "project-h"
version = "0.1.0"
description = "Project H — Personal AI Assistant V2"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "anyio>=4.0.0",
    "psutil>=5.9.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
